<!doctype html>
<!--
  도메인 루트 페이지 — https://appleap385-aaz0919.github.io/

  [표시명과 경로가 다르다 — 2026-08-25]
    표시명은 "Peace in Your Mind"이고 **경로·레포는 PeaceYourMind 그대로**다.
    AdSense 심사가 이 URL로 진행 중이고, 경로를 바꾸면 배포된 PWA가 끊긴다.
    ⛔ 아래 href의 /PeaceYourMind/를 표시명에 맞춰 고치지 말 것.

  [왜 이 레포가 필요한가]
    이 앱은 **프로젝트 페이지**라 /PeaceYourMind/ 하위에만 있다.
    도메인 루트는 404였다. AdSense는 사이트를 도메인 단위로 등록하고
    크롤러가 루트부터 훑으므로, 루트가 404면 검토에 불리하다.

  [ads.txt가 여기 있어야 하는 이유]
    ads.txt는 **도메인 루트에서만** 읽힌다(/ads.txt). 프로젝트 페이지의
    gh-pages 루트에 올리면 /PeaceYourMind/ads.txt가 되어 무효다.
    그래서 이 레포 루트에 둔다.

  ⚠ 즉시 리다이렉트를 걸지 않는다. AdSense 스크립트가 로드되기 전에 페이지를
    떠나면 소유권 확인과 검토에 불리하다. 링크만 둔다 — 사용자가 누른다.
-->
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Peace in Your Mind</title>
    <meta
      name="description"
      content="지금 마음에 닿는 말씀 한 구절과, 그 마음에 어울리는 영상"
    />
    <meta name="robots" content="index, follow" />
    <script
      async
      src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-5074778849873789"
      crossorigin="anonymous"
    ></script>
    <style>
      /* 색은 앱 theme.js에서 손으로 옮겼다 (T.ink / T.mist / T.muted / T.jade). */
      :root {
        --ink: #141e24;
        --ink-deep: #0b1216;
        --mist: #e9eeea;
        --muted: #8da29e;
        --jade: #7fb3a3;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        min-height: 100%;
      }
      body {
        background: linear-gradient(160deg, #221a28 0%, var(--ink) 55%, var(--ink-deep) 100%);
        color: var(--mist);
        font-family: "Noto Sans KR", "Apple SD Gothic Neo", system-ui, sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 40px 20px;
      }
      main {
        max-width: 480px;
        width: 100%;
      }
      h1 {
        margin: 0 0 18px;
        font-family: "Nanum Myeongjo", "Gowun Batang", serif;
        font-size: 27px;
        font-weight: 400;
        letter-spacing: 0.01em;
        word-break: keep-all;
      }
      p {
        margin: 0 0 14px;
        font-size: 14.5px;
        line-height: 1.85;
        color: var(--muted);
        word-break: keep-all;
      }
      .go {
        display: inline-block;
        margin-top: 18px;
        padding: 13px 26px;
        border: 1px solid #7fb3a399;
        border-radius: 3px;
        color: var(--mist);
        font-size: 15px;
        text-decoration: none;
        letter-spacing: 0.02em;
      }
      .go:hover {
        border-color: var(--jade);
        background: #ffffff08;
      }
      .sub {
        margin-top: 26px;
        font-size: 12px;
        letter-spacing: 0.04em;
      }
      .sub a {
        color: var(--muted);
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Peace in Your Mind</h1>
      <p>
        지금의 마음을 한 줄로 적으면, 그 마음에 닿는 성경 한 구절과 어울리는
        영상을 놓고 갑니다. 기록은 기기에만 남고 서버로 보내지 않습니다.
      </p>
      <p>웹에서 바로 쓸 수 있고, 설치하지 않아도 됩니다.</p>
      <a class="go" href="/PeaceYourMind/">Peace in Your Mind 열기</a>
      <p class="sub">
        <a href="/PeaceYourMind/privacy/">개인정보처리방침</a>
      </p>
    </main>
  </body>
</html>
